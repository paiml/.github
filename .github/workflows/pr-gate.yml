# PR Authorization Gate — block PRs from unauthorized contributors
#
# Reusable workflow called by all paiml repos. Lives in the public
# paiml/.github repo so both public and private callers can reference it.
#
# Policy: only org members and explicitly allowlisted external
# contributors may open pull requests. Unauthorized PRs are closed
# immediately with a polite comment.
#
# Caller workflow should trigger on pull_request_target (opened, reopened).

name: PR Authorization Gate

on:
  workflow_call:

jobs:
  authorize:
    # Runs on self-hosted intel. GitHub-hosted runners are BANNED fleet-wide:
    # they bill on private repos, and when the Actions spending limit is reached
    # the job does not start AT ALL — it reports `failure` with ZERO steps, which
    # is indistinguishable from this gate rejecting an author. That is exactly
    # what happened: this gate had NEVER executed on paiml/infra while showing
    # FAILURE on 100% of its PRs, so it was routinely stepped over (paiml/infra#231).
    # An authorization control that cannot start is worse than no control, because
    # it manufactures the appearance of enforcement.
    #
    # The original rationale for ubuntu-latest was that untrusted PR code must not
    # execute on self-hosted infra. That concern does not apply to THIS job: it has
    # exactly one step, `actions/github-script`, and there is NO `actions/checkout`
    # anywhere in this workflow. No PR-authored code is ever fetched or run here —
    # the job only reads `context.payload` and calls the API. If a checkout step is
    # ever added, this decision must be revisited.
    timeout-minutes: 22
    runs-on: [self-hosted, gate-light]
    permissions:
      pull-requests: write
    steps:
      - name: Determine authorization
        id: authz
        shell: bash
        env:
          # Everything the decision reads comes from the event payload and is
          # passed through env:, never interpolated into the script body.
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          PR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          set -uo pipefail

          # ==============================================================
          # DECISION COMES FROM THE EVENT PAYLOAD ONLY (aprender#5951).
          #
          # Operator: "the fix belongs in the job, not on gx10" and "have
          # authorize read author_association from the event". Standing
          # rule: no workflow may use credentials that live on a host.
          # This step therefore makes NO API call and never invokes `gh`:
          # the earlier membership probe depended on the runner's ambient
          # `gh` login, and a runner without one (gx10-blackwell) turned
          # every PR red with "indeterminate".
          #
          # Known limitation, accepted: GitHub reports a PRIVATE org
          # member's association as COLLABORATOR rather than MEMBER. That
          # is why COLLABORATOR is on the allow-list. The cost is that an
          # outside collaborator is indistinguishable from a private
          # member; collaborators already hold repo access granted by an
          # owner, so this does not widen who can open PRs.
          #
          # FAIL-CLOSED: anything not on the allow-list -- including an
          # empty, missing or unknown value -- fails. A missing value never
          # passes on a PR event.
          # Allow-list: OWNER MEMBER COLLABORATOR.
          # ==============================================================

          # Strip anything that could forge a workflow command before echoing.
          clean() { printf '%s' "$1" | tr -c 'A-Za-z0-9_.-' '?' | head -c 64; }

          allow() {
            echo "allow=true" >> "$GITHUB_OUTPUT"
            echo "reason=$1"  >> "$GITHUB_OUTPUT"
            echo "${2:-$PR_AUTHOR}: $1 -- ALLOWED"
          }

          case "${EVENT_NAME:-}" in
            pull_request_target|pull_request) ;;
            merge_group|push)
              # No PR author exists on these events. They are reachable only
              # by someone who already passed this gate on the PR (merge
              # queue entry / push to a protected branch need write access),
              # and the Close step below acts on a PR that does not exist
              # here. Allowing is safe; documented decision, not a default.
              allow "no PR author on ${EVENT_NAME:-} event (already gated at PR time)" "${EVENT_NAME:-}"
              exit 0 ;;
            *)
              echo "::error::pr-gate authorize: unsupported event '$(clean "${EVENT_NAME:-}")' -- refusing (fail-closed)"
              exit 1 ;;
          esac

          # Explicitly allowlisted EXTERNAL contributors (outside collaborators).
          case "${PR_AUTHOR:-}" in
            guyernest|spudnic) # guyernest: pmcp lead developer; spudnic: authorized contributor (operator 2026-09-26)
              allow "allowlisted external contributor"
              exit 0 ;;
          esac

          # Bots (dependabot, renovate, actions-user) are always allowed.
          if [ "${PR_AUTHOR_TYPE:-}" = "Bot" ]; then
            allow "bot"
            exit 0
          fi

          case "${PR_ASSOCIATION:-}" in
            OWNER|MEMBER|COLLABORATOR)
              allow "author_association=${PR_ASSOCIATION}"
              exit 0 ;;
            CONTRIBUTOR|FIRST_TIMER|FIRST_TIME_CONTRIBUTOR|MANNEQUIN|NONE)
              echo "allow=false" >> "$GITHUB_OUTPUT"
              echo "reason=author_association=${PR_ASSOCIATION} is not OWNER/MEMBER/COLLABORATOR and author is not allowlisted" >> "$GITHUB_OUTPUT"
              echo "::error::pr-gate: author_association=${PR_ASSOCIATION} for $(clean "${PR_AUTHOR:-}") -- REJECTED"
              exit 1 ;;
            *)
              # Empty, missing or unknown: could not establish who this is.
              # Fail red, leave the PR open for a human (no allow=false, so
              # the Close step does not run).
              echo "::error::pr-gate: author_association='$(clean "${PR_ASSOCIATION:-}")' is empty or unknown -- refusing (fail-closed)"
              exit 1 ;;
          esac

      - name: Close unauthorized PR
        if: ${{ !cancelled() && steps.authz.outputs.allow == 'false' }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          REASON: ${{ steps.authz.outputs.reason }}
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            const number = context.payload.pull_request.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body: [
                `Thank you for your interest in this project, @${author}.`,
                '',
                'This repository only accepts pull requests from organization members and authorized contributors. Your PR has been closed automatically.',
                '',
                'If you believe you should have access, please open an issue to discuss your contribution first.',
              ].join('\n'),
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
              state: 'closed',
            });

            core.setFailed(`PR author ${author} is not authorized (${process.env.REASON})`);
