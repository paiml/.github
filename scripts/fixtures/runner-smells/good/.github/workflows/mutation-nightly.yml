name: Mutation (nightly)
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
jobs:
  mutants:
    runs-on: [self-hosted, tier2]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo mutants --in-place
